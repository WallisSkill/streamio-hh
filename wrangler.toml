name = "stremio-vn-addon"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# nodejs_compat cho `process.env`, thứ CONFIG đọc lúc khởi tạo. Không có nó thì
# mọi biến môi trường đều undefined và addon chạy bằng giá trị mặc định.
compatibility_flags = ["nodejs_compat"]

# CẢNH BÁO: `wrangler deploy` GHI ĐÈ toàn bộ biến của Worker bằng đúng khối
# [vars] dưới đây. Biến thêm tay trong dashboard sẽ biến mất ở lần deploy sau,
# nên khai ở đây mới là chỗ giữ được — file này nằm trong git, dashboard thì không.
[vars]
# Hai nguồn này đang hỏng và không tạo ra stream nào, nhưng vẫn bắt mọi request
# chờ chúng. Đo 28/08/2026: ophim ~5.5s, hh3d ~2.5s mỗi request chưa cache.
# ophim1.com trả 404 ở mọi path API, và không mirror nào còn sống (ophim.cc trả
# trang chống bot, ophim9/13/16 timeout hoặc không phân giải được tên miền).
ENABLE_OPHIM = "0"
# HH3D bật lại: phần dò phim không cần curl nữa (hoathinh3d.de trả 200 cho fetch
# thường, kể cả từ Worker), và link phát thì mở được — xem lib/hh3dPlayer.js.
ENABLE_HH3D = "1"

# Nguồn C không cần NGUONC_PROXY hay NGUONC_UPSTREAM ở đây: request đi ra mang
# IP của người xem, và nguonc nhận IP dân cư. Đặt vào chỉ tổ thêm một chặng hỏng.
#
# Link PHÁT của Nguồn C thì lại không lấy được từ đây: streamc nằm sau
# Cloudflare và trả 403 cho mọi request từ Worker (đo 21/09/2026). Không có
# biến dưới đây thì tập Nguồn C ra dạng link mở trang; trỏ nó vào một bản addon
# ở chỗ khác (Vercel) thì phát được trong Stremio.
# STREAMC_UPSTREAM = "https://<addon trên vercel>"
# OVERRIDES = '{"tt0388629":{"kkphim":"dao-hai-tac"}}'
